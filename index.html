<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project 51</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>

</head>

<body>
    <div class="full-slider">
        <!-- slider-box start -->
        <div class="slider-box">
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/100/500/400"  /></div>
            </div>
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/110/500/400" title="Coffee 1" /></div>
            </div>
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/120/500/400" title="Coffee 1" /></div>
            </div>
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/130/500/400" title="Coffee 1" /></div>
            </div>
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/140/500/400" title="Coffee 1" /></div>
            </div>
            <div class="bxslider">
                <div><img src="https://picsum.photos/id/160/500/400" title="Coffee 1" /></div>
            </div>

        </div>
    </div>

    <!-- slider-box end -->


    <script>
        $(function () {
            $('.slider-box').bxSlider({
                mode: 'fade',
                captions: true,
                slideWidth: 500,
                auto:true,
                pause:4000,
                controls:false,
                keyboardEnabled:true,
                pager:false,

            });
        });
    </script>



</body>

</html>
